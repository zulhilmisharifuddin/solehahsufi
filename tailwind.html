<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tudung Shop</title>
  <!-- Tailwind CDN -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
   <link href="./css/output.css" rel="stylesheet">
</head>
<body class="font-sans bg-gray-100 text-gray-800">

  <!-- Header -->
  <header class="bg-purple-700 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Tudung Elegance</h1>
    <nav class="space-x-4">
      <a href="#" class="hover:underline">Home</a>
      <a href="#" class="hover:underline">Shop</a>
      <a href="#" class="hover:underline">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="text-center py-16 bg-purple-100">
    <h2 class="text-3xl font-semibold mb-4">Beautiful Tudung for Every Occasion</h2>
    <p class="mb-6">Discover our latest collection of stylish and comfortable tudung.</p>
    <button onclick="alert('Start shopping!')" 
            class="bg-purple-700 text-white px-6 py-2 rounded hover:bg-purple-800">
      Shop Now
    </button>
  </section>

  <!-- Products -->
  <section class="py-12">
    <h2 class="text-2xl font-bold text-center mb-8">Featured Tudung</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl mx-auto">
      
      <!-- Product Card -->
      <div class="bg-white shadow-md rounded-lg p-4 text-center">
        <img src="tudung1.jpg" alt="Tudung A" class="w-full h-48 object-cover rounded">
        <h3 class="text-lg font-semibold mt-4">Tudung A</h3>
        <p class="text-purple-700 font-bold">RM45</p>
        <button onclick="addToCart('Tudung A')" 
                class="mt-3 bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">
          Add to Cart
        </button>
      </div>

      <div class="bg-white shadow-md rounded-lg p-4 text-center">
        <img src="tudung2.jpg" alt="Tudung B" class="w-full h-48 object-cover rounded">
        <h3 class="text-lg font-semibold mt-4">Tudung B</h3>
        <p class="text-purple-700 font-bold">RM55</p>
        <button onclick="addToCart('Tudung B')" 
                class="mt-3 bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">
          Add to Cart
        </button>
      </div>

      <div class="bg-white shadow-md rounded-lg p-4 text-center">
        <img src="tudung3.jpg" alt="Tudung C" class="w-full h-48 object-cover rounded">
        <h3 class="text-lg font-semibold mt-4">Tudung C</h3>
        <p class="text-purple-700 font-bold">RM60</p>
        <button onclick="addToCart('Tudung C')" 
                class="mt-3 bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">
          Add to Cart
        </button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-purple-700 text-white text-center p-4">
    <p>&copy; 2026 Tudung Elegance. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    function addToCart(productName) {
      alert(productName + " has been added to your cart!");
    }
  </script>
</body>
</html>
